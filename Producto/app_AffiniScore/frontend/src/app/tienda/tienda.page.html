<ion-header class="ion-no-border">
  <ion-toolbar mode="ios" class="tienda-header-toolbar">
    <ion-button fill="clear" (click)="goBack()" class="back-circle-btn">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>
    
    <!-- Centered Header in Toolbar -->
    <div class="toolbar-center-container">
      <span class="store-toolbar-title">La Tienda Real</span>
      <span class="store-toolbar-subtitle">Recompensas Disponibles</span>
    </div>

    <!-- Points badge on the top right corner -->
    <ion-buttons slot="end" class="tienda-toolbar-end-buttons">
      <div class="points-badge-small-toolbar">
        <span class="points-value-small-tb">{{ points }}</span>
        <span class="points-label-small-tb">pts</span>
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="tienda-bg">
  <div class="tienda-container">

    <div class="rewards-grid">
      
      <!-- 1. Special Custom Creation Card -->
      <div class="cashback-reward-card custom-add-card" [ngClass]="{'active': showCustomForm}">
        
        <!-- Initial State: Trigger button -->
        <div class="card-content-overlay custom-add-initial" *ngIf="!showCustomForm" (click)="openCustomForm()">
          <div class="card-header-row">
            <h3 class="reward-card-title custom-add-title">Tu Recompensa</h3>
            <div class="reward-checkbox custom-add-checkbox">
              <ion-icon name="add-outline"></ion-icon>
            </div>
          </div>
          <div class="custom-add-footer">
            <ion-icon name="sparkles-outline" class="custom-sparkle-icon"></ion-icon>
            <span class="custom-add-subtitle">Valida con IA</span>
          </div>
        </div>

        <!-- Form State: Typing -->
        <div class="card-content-overlay custom-add-form" *ngIf="showCustomForm && !aiEvaluating && !showAiProposal">
          <div class="form-header">
            <span class="form-label">¿Qué deseas?</span>
            <textarea class="form-textarea" placeholder="Ej: Picnic en el parque..." [(ngModel)]="customTitle" rows="3"></textarea>
          </div>
          <div class="form-actions-row">
            <button class="btn-form-cancel" (click)="cancelCustomReward()">Atrás</button>
            <button class="btn-form-ai" (click)="calculateAiPoints()">Calcular</button>
          </div>
        </div>

        <!-- Loading State: AI Evaluation -->
        <div class="card-content-overlay custom-add-loading" *ngIf="showCustomForm && aiEvaluating">
          <div class="spinner-container">
            <div class="custom-spinner"></div>
            <span class="loading-label">IA Evaluando...</span>
          </div>
        </div>

        <!-- Result State: AI Points Suggestion -->
        <div class="card-content-overlay custom-add-proposal" *ngIf="showCustomForm && !aiEvaluating && showAiProposal">
          <div class="proposal-info">
            <span class="proposal-title">IA propone:</span>
            <div class="proposal-points-row">
              <span class="proposal-points-value">{{ aiProposedPoints }}</span>
              <span class="proposal-points-suffix">pts</span>
            </div>
          </div>
          <div class="proposal-actions">
            <button class="btn-proposal-retry" (click)="calculateAiPoints()">Recotizar</button>
            <button class="btn-proposal-accept" (click)="saveCustomReward()">Aceptar</button>
          </div>
        </div>

      </div>

      <!-- General Catalog Cards -->
      <div class="cashback-reward-card" 
           [ngClass]="[reward.class, reward.status]" 
           *ngFor="let reward of rewards"
           (touchstart)="startPressTimer(reward)"
           (touchend)="clearPressTimer()"
           (mousedown)="startPressTimer(reward)"
           (mouseup)="clearPressTimer()"
           (mouseleave)="clearPressTimer()">
        
        <!-- Image Background -->
        <img [src]="reward.image" class="card-bg-image" alt="{{ reward.title }} illustration" />

        <!-- Overlay Container for Texts and Actions -->
        <div class="card-content-overlay">
          <!-- Header: Title and Checkbox -->
          <div class="card-header-row">
            <h3 class="reward-card-title">{{ reward.title }}</h3>
            
            <!-- Interactive Checkbox -->
            <div class="reward-checkbox" 
                 [ngClass]="{
                   'checked': reward.status === 'success' || reward.status === 'pending', 
                   'disabled': points < reward.points && reward.status === 'idle',
                   'pending-check': reward.status === 'pending'
                 }"
                 (click)="reward.status === 'idle' && points >= reward.points ? initiateRedeem(reward) : null">
              <ion-icon name="checkmark-outline" *ngIf="reward.status === 'success' || reward.status === 'pending'"></ion-icon>
            </div>
          </div>

          <!-- Footer: Points Value -->
          <div class="reward-points-container">
            <span class="points-label-small">Costo</span>
            <div class="points-number-row">
              <span class="points-value-large">{{ reward.points }}</span>
              <span class="points-suffix">pts</span>
            </div>
          </div>
        </div>

        <!-- Glassmorphic Pending Overlay -->
        <div class="pending-card-overlay" *ngIf="reward.status === 'pending'">
          <span class="overlay-title">¿Validar?</span>
          <div class="overlay-btn-group">
            <button class="btn-overlay-cancel" (click)="cancelRedeem(reward)">Atrás</button>
            <button class="btn-overlay-confirm" (click)="confirmRedeem(reward)">Aceptar</button>
          </div>
        </div>

        <!-- Success overlay or visual styling is naturally done via checked state -->
        <div class="success-card-overlay" *ngIf="reward.status === 'success'">
          <div class="success-icon-wrapper">
            <ion-icon name="checkmark-outline"></ion-icon>
          </div>
          <span class="success-text">¡Canjeado!</span>
        </div>

      </div>
    </div>

  </div>
</ion-content>
