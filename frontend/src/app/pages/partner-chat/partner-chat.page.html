<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Chat con Pareja</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding chat-content" color="light">
  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Cargando chat...</p>
  </div>

  <div *ngIf="!isLoading && !roomId" class="ion-text-center ion-padding">
    <ion-icon name="heart-dislike-outline" color="medium" style="font-size: 3rem;"></ion-icon>
    <p>Aún no tienes a tu pareja vinculada o no existe una sala de chat para ustedes.</p>
    <ion-button routerLink="/qr" expand="block" shape="round" color="primary">Vincular Pareja</ion-button>
  </div>

  <div class="chat-container" *ngIf="!isLoading && roomId">
    <div *ngFor="let msg of messages" class="message-wrapper" [ngClass]="{'me': msg.sender_id === currentUserId, 'partner': msg.sender_id !== currentUserId}">
      <div class="message-bubble">
        <p>{{ msg.message }}</p>
        <span class="time">{{ msg.created_at | date:'shortTime' }}</span>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer *ngIf="!isLoading && roomId">
  <ion-toolbar>
    <ion-item lines="none" class="input-item">
      <ion-input [(ngModel)]="newMessage" placeholder="Escribe un mensaje..." (keyup.enter)="sendMessage()"></ion-input>
      <ion-button fill="clear" slot="end" (click)="sendMessage()" [disabled]="!newMessage.trim()">
        <ion-icon name="send" color="primary"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
</ion-footer>
