<!-- Menú lateral para el historial de chats -->
<ion-menu contentId="main-chat-content" side="start" menuId="chat-menu">
  <ion-header class="ion-no-border">
    <ion-toolbar mode="ios">
      <ion-title style="font-size: 16px; font-weight: 700;">Historial de Chats</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-button expand="block" fill="outline" class="new-chat-btn" (click)="createNewSession()" style="margin: 16px; --border-radius: 8px;">
      <ion-icon name="add-circle-outline" slot="start"></ion-icon>
      Nuevo Chat
    </ion-button>
    <ion-list lines="none">
      <ion-item *ngFor="let session of aiSessions" (click)="loadSession(session.id)" button detail="false" [class.active-session]="session.id === roomId" style="--border-radius: 8px; margin: 4px 8px; font-size: 14px;">
        <ion-icon name="chatbubble-outline" slot="start" style="font-size: 18px; color: #7e7e7e;"></ion-icon>
        <ion-label>
          <h3 style="font-weight: 600; color: #3a3a3a;">{{ session.title || 'Chat sin título' }}</h3>
          <p style="font-size: 12px; color: #9e9e9e;">{{ session.created_at | date:'dd MMM, HH:mm' }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-chat-content">
  <ion-header class="ion-no-border">
    <ion-toolbar mode="ios" class="main-header-toolbar">
      <div class="header-content-wrapper">
        <ion-buttons slot="start">
          <ion-back-button defaultHref="/tabs/home" text="" icon="chevron-back-outline" style="color: #1A1A1A;"></ion-back-button>
          <ion-menu-button autoHide="false" style="color: #1A1A1A;"></ion-menu-button>
          <div class="chat-avatar" style="width: 38px; height: 38px; border-radius: 50%; overflow: hidden; margin-left: 4px; background: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <ion-icon name="sparkles" style="font-size: 20px; color: #bd343a;"></ion-icon>
          </div>
        </ion-buttons>
        
        <div class="brand-group" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <span style="font-weight: 800; font-size: 16px; color: #3a3a3a; letter-spacing: -0.5px;">AffiniCoach IA</span>
          <span *ngIf="!isLoading" style="font-size: 11px; color: #bd343a; font-weight: 700;">EN LÍNEA</span>
          <span *ngIf="isLoading" style="font-size: 11px; color: #7e7e7e; font-weight: 600;">ESCRIBIENDO...</span>
        </div>
        
        <ion-buttons slot="end">
          <ion-button class="btn-settings">
            <ion-icon src="assets/icons/hero/outline/cog-6-tooth.svg"></ion-icon>
          </ion-button>
        </ion-buttons>
      </div>
    </ion-toolbar>
  </ion-header>

<ion-content class="dashboard-bg" [fullscreen]="true">
  <div class="chat-container">
    <div *ngFor="let msg of messages" class="message-wrapper" [class.mine]="isMine(msg)">
      
      <!-- Avatar de la IA -->
      <div *ngIf="!isMine(msg)" class="message-avatar" style="width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-right: 8px; flex-shrink: 0; align-self: flex-end; margin-bottom: 5px;">
        <ion-icon name="sparkles" style="font-size: 14px; color: #bd343a;"></ion-icon>
      </div>

      <div class="message-bubble">
        <p>{{ msg.message }}</p>
        <span class="message-time">{{ msg.created_at | date:'shortTime' }}</span>
      </div>

      <!-- Avatar del Usuario -->
      <div *ngIf="isMine(msg)" class="message-avatar" style="width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: #e0e0e0; display: flex; align-items: center; justify-content: center; margin-left: 8px; flex-shrink: 0; align-self: flex-end; margin-bottom: 5px;">
        <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" style="width: 100%; height: 100%; object-fit: cover;" alt="Tú" />
        <ion-icon *ngIf="!userAvatarUrl" name="person" style="font-size: 14px; color: #7e7e7e;"></ion-icon>
      </div>

    </div>
    
    <!-- Typing Indicator -->
    <div *ngIf="isLoading" class="message-wrapper">
      <div class="message-bubble" style="background: #ffffff; color: #111b21; border-radius: 8px 8px 8px 0px; box-shadow: 0 1px 0.5px rgba(11, 20, 26, .13); border: none;">
        <p style="padding-right: 10px;">Escribiendo <ion-icon name="ellipsis-horizontal"></ion-icon></p>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar style="--background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); --border-width: 0; padding-bottom: 12px; padding-top: 8px;">
    <div class="input-wrapper-container" style="display: flex; align-items: flex-end; gap: 10px; width: 100%; padding: 0 16px;">
      <div class="input-container" style="flex: 1; display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 24px; padding: 0 16px; min-height: 44px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05);">
        <ion-icon src="assets/icons/hero/outline/face-smile.svg" style="font-size: 24px; color: #7e7e7e; margin-right: 12px;"></ion-icon>
        <ion-input 
          [(ngModel)]="newMessage" 
          placeholder="Escribe un mensaje..." 
          class="chat-input"
          (keyup.enter)="sendMessage()"
          style="--background: transparent; --padding-start: 0; font-size: 15px; --color: #3a3a3a; font-weight: 500;"
        ></ion-input>
      </div>
      <div class="send-btn-container" (click)="sendMessage()" style="background: linear-gradient(135deg, #df5b61 0%, #bd343a 100%); border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(189, 52, 58, 0.3); flex-shrink: 0;">
        <ion-icon src="assets/icons/hero/solid/paper-airplane.svg" style="color: white; font-size: 20px;"></ion-icon>
      </div>
    </div>
  </ion-toolbar>
</ion-footer>
</div>
