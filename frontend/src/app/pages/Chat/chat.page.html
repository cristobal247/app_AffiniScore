<ion-menu side="end" contentId="main-content">
  <ion-header>
    <ion-toolbar style="--background: #B0232A; --color: white;">
      <ion-title>Historial de Chats</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item button (click)="createNewSession()" detail="false" style="--background: #fdf2f2; --color: #B0232A;">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        <ion-label style="font-weight: 600;">Nueva Conversación</ion-label>
      </ion-item>
      
      <ion-item button *ngFor="let session of aiSessions" (click)="loadSession(session.id)" detail="false">
        <ion-icon name="chatbubble-outline" slot="start" style="color: #666;"></ion-icon>
        <ion-label class="ion-text-wrap" style="font-size: 14px;">{{ session.title || 'Nueva Conversación' }}</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
<ion-header class="ion-no-border">
  <ion-toolbar mode="ios" class="whatsapp-header-toolbar">
    <div class="header-content-wrapper" style="display: flex; align-items: center; padding: 0 8px; width: 100%;">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/actions" text="" icon="arrow-back-outline"></ion-back-button>
        <div class="chat-avatar" style="width: 40px; height: 40px; border-radius: 50%; overflow: hidden; margin-left: -5px; margin-right: 12px; background: white; display: flex; align-items: center; justify-content: center;">
          <ion-icon name="sparkles" style="font-size: 24px; color: #B0232A;"></ion-icon>
        </div>
      </ion-buttons>
      <div class="brand-group" style="display: flex; flex-direction: column; flex: 1; text-align: left;">
        <span style="font-weight: 600; font-size: 17px; color: white;">AffiniCoach IA</span>
        <span *ngIf="!isLoading" style="font-size: 13px; color: rgba(255,255,255,0.85);">en línea</span>
        <span *ngIf="isLoading" style="font-size: 13px; color: rgba(255,255,255,0.85);">escribiendo...</span>
      </div>
      <ion-buttons slot="end">
        <ion-menu-button style="color: white;"></ion-menu-button>
      </ion-buttons>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-bg">
  <div class="chat-container">
    <div *ngFor="let msg of messages" class="message-wrapper" [class.mine]="isMine(msg)">
      <div class="message-bubble">
        <p>{{ msg.message }}</p>
        <span class="message-time">{{ msg.created_at | date:'shortTime' }}</span>
      </div>
    </div>
    
    <!-- Typing Indicator -->
    <div *ngIf="isLoading" class="message-wrapper">
      <div class="message-bubble" style="background: #ffffff; color: #111b21; border-radius: 8px 8px 8px 0px; box-shadow: 0 1px 0.5px rgba(11, 20, 26, .13); border: none;">
        <p style="padding-right: 10px;">Escribiendo <ion-icon name="ellipsis-horizontal"></ion-icon></p>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border" style="background: #f0f2f5;">
  <ion-toolbar style="--background: transparent; --border-width: 0;">
    <div class="input-wrapper-container" style="display: flex; align-items: flex-end; gap: 8px; width: 100%; padding: 6px 8px;">
      <div class="input-container" style="flex: 1; display: flex; align-items: center; background: #ffffff; border-radius: 24px; padding: 0 16px; min-height: 48px; box-shadow: 0 1px 1px rgba(0,0,0,0.05);">
        <ion-icon name="happy-outline" style="font-size: 26px; color: #8696a0; margin-right: 12px;"></ion-icon>
        <ion-input 
          [(ngModel)]="newMessage" 
          placeholder="Mensaje" 
          class="chat-input"
          (keyup.enter)="sendMessage()"
          style="--background: transparent; --padding-start: 0; font-size: 16px; --color: #111b21;"
        ></ion-input>
        <ion-icon name="camera-outline" style="font-size: 26px; color: #8696a0; margin-left: 12px;"></ion-icon>
      </div>
      <div class="send-btn-container" (click)="sendMessage()" style="background: #B0232A; border-radius: 50%; width: 48px; height: 48px; display: flex; justify-content: center; align-items: center; box-shadow: 0 1px 1px rgba(0,0,0,0.05); margin-bottom: 2px;">
        <ion-icon name="send" style="color: white; font-size: 20px; transform: translateX(2px);"></ion-icon>
      </div>
    </div>
  </ion-toolbar>
</ion-footer>
</div>
