<ion-content class="map-page" [forceOverscroll]="false">
  <!-- El mapa que ocupa toda la pantalla -->
  <div id="map"></div>

  <!-- Capas flotantes sobre el mapa -->
  
  <!-- 1. Botones Flotantes Superiores -->
  <div class="top-floating-container">
    <!-- Lado Izquierdo: Botón de Perfil -->
    <button class="profile-floating-btn" routerLink="/profile">
      <div class="user-avatar-circle">
        <img [src]="userAvatarUrl || '/assets/images/user.png'" alt="Perfil" />
      </div>
    </button>

    <!-- Lado Derecho: Acciones (Agregar lugar especial, ajustes) -->
    <div class="actions-floating-group">
      <!-- Botón de ingresar dirección del lugar visitado -->
      <button class="action-floating-btn" (click)="abrirRegistrarLugar()" title="Registrar lugar de primera cita">
        <ion-icon name="add-circle-outline"></ion-icon>
      </button>
      
      <!-- Botón de configuración/opciones adicionales -->
      <button class="action-floating-btn">
        <ion-icon name="cog-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- 2. Botón SOS en la esquina inferior derecha -->
  <div class="sos-floating-container">
    <button 
      class="sos-floating-btn" 
      [class.recording]="isRecording"
      type="button"
      (click)="handleSOS()">
      <ion-icon name="warning-outline" *ngIf="!isRecording"></ion-icon>
      <span>{{ isRecording ? '🛑' : 'SOS' }}</span>
    </button>
  </div>

  <!-- 3. Bottom Pill con los dos avatares para centrado (bottom center) -->
  <div class="bottom-pill-container">
    <!-- Avatar Usuario -->
    <div class="avatar-pill-btn user-avatar-pill" (click)="centrarEnUsuario()" title="Centrar en mí">
      <img [src]="userAvatarUrl || '/assets/images/user.png'" alt="Tú" />
    </div>

    <!-- Avatar Pareja -->
    <div class="avatar-pill-btn partner-avatar-pill" (click)="centrarEnPareja()" title="Centrar en mi pareja">
      <img [src]="partnerAvatarUrl || '/assets/images/user.png'" alt="Pareja" />
    </div>
    
    <!-- Icono decorativo / acción de chispa en el pill -->
    <div class="pill-spark-icon">
      <ion-icon name="sparkles-outline"></ion-icon>
    </div>
  </div>

</ion-content>
