<ion-header class="ion-no-border">
  <ion-toolbar mode="ios" class="main-header-toolbar" style="padding-top: calc(var(--ion-safe-area-top, 20px) + 15px) !important; --background: #F8F8F8;">
    <div style="display: flex; align-items: center; width: 100%; padding: 0 16px; position: relative; min-height: 44px;">
      <button *ngIf="!isSearching" (click)="goBack()" style="background: #ffffff; color: #FA8072; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: none; margin: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); cursor: pointer; outline: none; padding: 0; position: absolute; left: 16px; z-index: 10;">
        <ion-icon name="chevron-back-outline" style="font-size: 20px; color: #FA8072;"></ion-icon>
      </button>
      <div style="flex: 1; text-align: center; width: 100%; padding: 0 40px;">
        <span *ngIf="!isSearching" style="font-size: 17px; font-weight: 800; color: #111827; letter-spacing: -0.5px; font-family: 'Montserrat', sans-serif;">Catálogo de Retos</span>
        <ion-searchbar *ngIf="isSearching" 
                       [(ngModel)]="searchTerm" 
                       (ionInput)="filterChallenges()" 
                       placeholder="Buscar retos..." 
                       show-cancel-button="never"
                       style="--background: #ffffff; --border-radius: 12px; --box-shadow: 0 2px 8px rgba(0,0,0,0.04); height: 38px; padding: 0; margin: 0; font-family: 'Montserrat', sans-serif;">
        </ion-searchbar>
      </div>
      <button (click)="toggleSearch()" style="background: #ffffff; color: #FA8072; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: none; margin: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); cursor: pointer; outline: none; padding: 0; position: absolute; right: 16px; z-index: 10;">
        <ion-icon [name]="isSearching ? 'close-outline' : 'search-outline'" style="font-size: 18px; color: #FA8072;"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  <div class="content-wrapper">
    <!-- Hero -->
    <div class="hero-section">
      <h1 style="font-size: 26px;">Retos de<br>Desconexión</h1>
      <p>Elijan un reto juntos, dejen el celular y ganen puntos. Construyan momentos reales, libres de notificaciones.</p>
    </div>

    <div class="puntos-card">
      <h2>+450</h2>
      <p>PUNTOS ACUMULADOS</p>
    </div>

    <!-- Challenges Grid -->
    <div class="challenges-grid">
      <div class="grid-card" *ngFor="let item of filteredChallenges; let i = index">
        <img [src]="getChallengeImage(i)" class="card-image" />
        <div class="card-body">
          <h3>{{ item.title }}</h3>
          
          <div class="points-pill-container">
            <span class="points-pill">Gana +{{ item.points }} Puntos</span>
          </div>
          
          <p class="card-desc">{{ item.description }}</p>
          
          <button class="action-btn" *ngIf="!item.myAccepted" (click)="triggerChallengeUpload(item)">
            Aceptar Reto
          </button>
          <button class="action-btn outline-btn" *ngIf="item.myAccepted && !item.partnerAccepted" (click)="confirmJointAcceptance(item)">
            Confirmar Pareja
          </button>
          <button class="action-btn done-btn" *ngIf="item.partnerAccepted" disabled>
            Completado
          </button>
        </div>
      </div>
    </div>
    <input type="file" id="challenge-file-input" style="display: none" accept="image/*" (change)="onChallengeFileSelected($event)">
  </div>
</ion-content>
